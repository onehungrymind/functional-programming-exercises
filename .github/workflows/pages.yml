# Builds the app and publishes it to GitHub Pages.
#
# The content gate runs first. A broken exercise is worse than a stale demo, so a failing
# `npm run verify` stops the deploy rather than shipping a rung whose solution does not pass.
name: Deploy to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it halfway.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Check the content
        run: npm run verify
      - name: Unit tests
        run: npm test
      - run: npm run build
      # Pages serves from a repository subpath. Vite is configured with `base: './'` and the
      # app routes on the hash, so the output needs no rewriting and no server rules.
      - name: Skip Jekyll
        run: touch apps/web/dist/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
